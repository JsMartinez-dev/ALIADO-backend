
name: ALIADO - CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # CI

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aliado_ci
          POSTGRES_USER: aliado
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aliado -d aliado_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://localhost:5432/aliado_ci
      DATABASE_USERNAME: aliado
      DATABASE_PASSWORD: ci_password
      ALIADO_STORAGE_DIR: ./storage-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  # 2. Docker
  publish:
    name: Publish Docker to Azure ACR
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      }}

    permissions:
      contents: read
      id-token: write

    env:
      ACR_NAME: acraliadodev
      ACR_LOGIN_SERVER: acraliadodev.azurecr.io
      IMAGE_NAME: aliado-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build Docker image
        run: |
          docker build \
            --tag "$ACR_LOGIN_SERVER/$IMAGE_NAME:v1" \
            --tag "$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}" \
            .

      - name: Push Docker image to ACR
        run: |
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:v1"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}"

      - name: Show published images
        run: |
          echo "Image published successfully"
          echo "$ACR_LOGIN_SERVER/$IMAGE_NAME:v1"
          echo "$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}"
  # 3. CD
  deploy:
    name: Deploy to Azure Container Apps
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    env:
      RESOURCE_GROUP: rg-aliado-dev
      CONTAINER_APP_NAME: aliado-backend
      ACR_LOGIN_SERVER: acraliadodev.azurecr.io
      IMAGE_NAME: aliado-backend

    steps:
      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Azure Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}" \
            --output none

      - name: Verify deployed image
        run: |
          EXPECTED_IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}"

          ACTUAL_IMAGE=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" \
            --output tsv)

          echo "Expected image: $EXPECTED_IMAGE"
          echo "Actual image: $ACTUAL_IMAGE"

          if [ "$ACTUAL_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "::error::Deployed image does not match the commit SHA"
            exit 1
          fi

          echo "Image configuration verified successfully"
