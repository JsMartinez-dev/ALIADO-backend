# Tests: H2 en memoria, sin Flyway, sin red.
spring.profiles.active=test
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test-user
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
aliado.mail.from=no-reply@example.test
aliado.mail.from-name=ALIADO Test
spring.datasource.url=jdbc:h2:mem:aliado-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false
aliado.storage.dir=${java.io.tmpdir}/aliado-test-storage
aliado.crypto.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
aliado.session.ttl-hours=24
aliado.admin.email=
aliado.admin.password=
aliado.features.chat-interno=false
aliado.features.soporte-whatsapp=false
aliado.features.onboarding-asistido=false
aliado.features.mapa-prestadores=false
aliado.features.insignia-formalizacion=false
aliado.features.referidos=false
aliado.features.idiomas-adicionales=false
aliado.features.integracion-institucional=false
aliado.features.pagos.piloto-enabled=false
aliado.features.pagos.piloto-approved=false
