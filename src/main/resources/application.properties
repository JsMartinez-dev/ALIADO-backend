spring.application.name=aliado
#spring.profiles.active=local
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

server.address=0.0.0.0


spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}
server.servlet.context-path=/

aliado.session.ttl-hours=${ALIADO_SESSION_TTL_HOURS:24}
aliado.storage.dir=${ALIADO_STORAGE_DIR:./storage}
aliado.crypto.key=${ALIADO_AES_KEY:}
aliado.admin.email=${ALIADO_ADMIN_EMAIL:}
aliado.admin.password=${ALIADO_ADMIN_PASSWORD:}

# Piloto push (F09-PUSH): vigencia del trabajo desde el encolado.
aliado.push.vigencia-minutos=${ALIADO_PUSH_VIGENCIA_MINUTOS:60}

# F09-PUSH-06: worker dirigido por LISTEN/NOTIFY. Apagado hasta que F09-PUSH-08 aporte el
# procesamiento de la reclamación. La escucha usa una sesión dedicada fuera del pool; con
# un pooler en modo transacción, apuntar la URL a una conexión directa o a un pool de
# sesión (validación pendiente en Azure).
aliado.push.worker-habilitado=${ALIADO_PUSH_WORKER_HABILITADO:false}
aliado.push.escucha.url=${ALIADO_PUSH_ESCUCHA_URL:${DATABASE_URL}}
aliado.push.escucha.username=${ALIADO_PUSH_ESCUCHA_USERNAME:${DATABASE_USERNAME}}
aliado.push.escucha.password=${ALIADO_PUSH_ESCUCHA_PASSWORD:${DATABASE_PASSWORD}}
aliado.push.reconexion.base-ms=${ALIADO_PUSH_RECONEXION_BASE_MS:500}
aliado.push.reconexion.max-ms=${ALIADO_PUSH_RECONEXION_MAX_MS:15000}

# F09-PUSH-07: reclamación corta del worker. El lote total se acota (D-08: hasta 10) y la
# vigencia (D-08: 45 s) debe superar el timeout de FCM (5 s) para poder guardar el
# resultado antes de que la reclamación venza y otra instancia la recupere.
aliado.push.reclamacion.tamano-lote=${ALIADO_PUSH_RECLAMACION_TAMANO_LOTE:10}
aliado.push.reclamacion.vigencia-segundos=${ALIADO_PUSH_RECLAMACION_VIGENCIA_SEGUNDOS:45}

# F09-PUSH-08: política de reintento por dispositivo. El backoff crece desde la base con
# jitter y respeta Retry-After; el máximo incluye el intento inicial. Un siguiente plazo
# que alcance la vigencia cierra la entrega como expirada.
aliado.push.reintento.max-intentos=${ALIADO_PUSH_REINTENTO_MAX_INTENTOS:5}
aliado.push.reintento.base-segundos=${ALIADO_PUSH_REINTENTO_BASE_SEGUNDOS:30}

# F09-PUSH-08: ventana mínima para iniciar un envío (D-08). Antes de llamar al proveedor se
# exige que la reclamación conserve el timeout de FCM (5 s) más un margen para guardar el
# resultado; si no alcanza, la reclamación se libera sin enviar. La suma debe ser menor que
# la vigencia de la reclamación (45 s).
aliado.push.envio.timeout-segundos=${ALIADO_PUSH_ENVIO_TIMEOUT_SEGUNDOS:5}
aliado.push.envio.margen-segundos=${ALIADO_PUSH_ENVIO_MARGEN_SEGUNDOS:5}

# F09-PUSH-08/F09-PUSH-09: proveedor de entrega. "falso" no contacta con FCM y es el
# valor por defecto para el piloto local y las pruebas. "firebase" compone el adaptador
# real y exige proyecto y credenciales del entorno; FCM solo se habilita para
# NUEVA_OPORTUNIDAD.
aliado.push.proveedor=${ALIADO_PUSH_PROVEEDOR:falso}

# F09-PUSH-11: activación por entorno y tipo y apagado controlado del canal. La lista de
# tipos habilitados solo admite NUEVA_OPORTUNIDAD en el piloto; un nombre desconocido
# impide arrancar. Con entrega-habilitada=false no se encola trabajo nuevo y las entregas
# pendientes se suprimen sin llamar a FCM: la bandeja (GET /api/v1/notificaciones) sigue
# operativa y volver a activar no envía avisos históricos.
aliado.push.entrega-habilitada=${ALIADO_PUSH_ENTREGA_HABILITADA:true}
aliado.push.tipos-habilitados=${ALIADO_PUSH_TIPOS_HABILITADOS:NUEVA_OPORTUNIDAD}

# F09-PUSH-09: credenciales por entorno. El proyecto se separa por entorno y las
# credenciales se inyectan desde el gestor de secretos: JSON de la cuenta de servicio en
# ALIADO_FCM_CREDENCIALES_JSON o, si está vacío, la credencial por defecto de Google
# (GOOGLE_APPLICATION_CREDENTIALS / identidad del entorno). No versionar estos valores.
# El TTL acota lo que FCM puede retener; el canal es el acordado con Android.
aliado.push.firebase.proyecto-id=${ALIADO_FCM_PROYECTO_ID:}
aliado.push.firebase.credenciales-json=${ALIADO_FCM_CREDENCIALES_JSON:}
aliado.push.firebase.ttl-segundos=${ALIADO_FCM_TTL_SEGUNDOS:3600}
aliado.push.firebase.canal-android=${ALIADO_FCM_CANAL_ANDROID:aliado_oportunidades}

# Funcionalidades futuras deshabilitadas
aliado.features.chat-interno=false
aliado.features.soporte-whatsapp=false
aliado.features.onboarding-asistido=false
aliado.features.mapa-prestadores=false
aliado.features.insignia-formalizacion=false
aliado.features.referidos=false
aliado.features.idiomas-adicionales=false
aliado.features.integracion-institucional=false
aliado.features.pagos.piloto-enabled=false
aliado.features.pagos.piloto-approved=false

# Documentacion API
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logs
logging.level.root=INFO
logging.level.com.sebastian.spring.mas.aliado.aliado=INFO

