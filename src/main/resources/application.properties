spring.application.name=aliado
#spring.profiles.active=local
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

server.address=0.0.0.0


spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}
server.servlet.context-path=/

aliado.session.ttl-hours=${ALIADO_SESSION_TTL_HOURS:24}
aliado.storage.dir=${ALIADO_STORAGE_DIR:./storage}
aliado.crypto.key=${ALIADO_AES_KEY:}
aliado.admin.email=${ALIADO_ADMIN_EMAIL:}
aliado.admin.password=${ALIADO_ADMIN_PASSWORD:}

# Funcionalidades futuras deshabilitadas
aliado.features.chat-interno=false
aliado.features.soporte-whatsapp=false
aliado.features.onboarding-asistido=false
aliado.features.mapa-prestadores=false
aliado.features.insignia-formalizacion=false
aliado.features.referidos=false
aliado.features.idiomas-adicionales=false
aliado.features.integracion-institucional=false
aliado.features.pagos.piloto-enabled=false
aliado.features.pagos.piloto-approved=false

# Documentacion API
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logs
logging.level.root=INFO
logging.level.com.sebastian.spring.mas.aliado.aliado=INFO

